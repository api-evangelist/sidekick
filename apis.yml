description: Sidekick is a UK-based online wealth management and investing platform that offers
  expert-led investments and savings products once reserved for the ultra-wealthy, delivered through
  a mobile app and web platform. Its product range spans managed investment portfolios, savings
  accounts, private equity access, and cryptocurrency exposure. Surfaced as a portfolio company of
  Seedcamp, Sidekick is a consumer (B2C) fintech and publishes no public developer API, developer
  portal, or API documentation as of this enrichment pass.
